# DB + App + Tests.  Uso:
#   docker compose up --build db app        -> API en http://localhost:8000/docs
#   docker compose run --rm tests           -> pruebas contra PostgreSQL (base aulaplus_test,
#                                              separada de la de la app)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aulaplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aulaplus}
      POSTGRES_DB: ${POSTGRES_DB:-aulaplus}
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aulaplus} -d ${POSTGRES_DB:-aulaplus}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aulaplus}:${POSTGRES_PASSWORD:-aulaplus}@db:5432/${POSTGRES_DB:-aulaplus}
      SEED_DATOS: ${SEED_DATOS:-true}
      PASARELA_RECHAZAR: ${PASARELA_RECHAZAR:-AUL-C040}
      APP_ENV: ${APP_ENV:-docker}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aulaplus}:${POSTGRES_PASSWORD:-aulaplus}@db:5432/aulaplus_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_pg:
