name: CI AulaPlus

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Pruebas + cobertura (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Pruebas unitarias e integración (cobertura >= 80 %)
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Ejecutar casos CSV del docente
        run: python -m scripts.correr_casos_csv
      - name: Exportar OpenAPI
        run: python -m scripts.exportar_openapi
      - uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: |
            coverage.xml
            docs/evidencias/
            docs/api/openapi.json

  postgres:
    name: Integración con PostgreSQL
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aulaplus
          POSTGRES_PASSWORD: aulaplus
          POSTGRES_DB: aulaplus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aulaplus" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://aulaplus:aulaplus@localhost:5432/aulaplus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/integracion/test_repositorios_sql.py -v

  docker:
    name: Construir imagen
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target app -t aulaplus:ci .
